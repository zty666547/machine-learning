<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #172033; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .label { font-size: 13px; }
    .small { font-size: 11px; fill: #64748b; }
    .value { font-size: 15px; font-weight: 700; }
    .note { font-size: 12px; fill: #475569; }
    </style><rect width="1000" height="560" fill="#ffffff"/>
    <text x="54" y="52" class="title">连续条件 VAE：网络宽度稳定性选择</text>
    <text x="54" y="77" class="subtitle">固定 β=0.20、潜变量维度=16；每种宽度采用 3 个随机种子、7 个连续目标强度</text>
    <rect x="54" y="108" width="892" height="315" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="96" y="151" class="small">隐藏层宽度</text><text x="297" y="151" class="small">平均 3-mer JS ↓</text><text x="502" y="151" class="small">平均目标—GC Pearson</text><text x="749" y="151" class="small">Pearson 标准差 ↓</text><rect x="78" y="165" width="844" height="70" rx="8" fill="#ffffff" stroke="#dbe3ee"/><text x="122" y="207" class="value">96</text><rect x="292" y="192" width="140.0" height="18" rx="4" fill="#94a3b8"/><text x="440.0" y="207" class="value">0.00455</text><text x="551" y="207" class="value">-0.817</text><rect x="746" y="192" width="120.0" height="18" rx="4" fill="#94a3b8"/><text x="874.0" y="207" class="value">0.124</text><rect x="78" y="263" width="844" height="70" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="122" y="305" class="value">128</text><rect x="292" y="290" width="136.28321527664923" height="18" rx="4" fill="#2563eb"/><text x="436.28321527664923" y="305" class="value">0.00442</text><text x="551" y="305" class="value">-0.870</text><rect x="746" y="290" width="32.990914426693735" height="18" rx="4" fill="#2563eb"/><text x="786.9909144266937" y="305" class="value">0.034</text><text x="122" y="325" class="small">当前选定配置</text><rect x="54" y="452" width="892" height="65" rx="8" fill="#eff6ff"/>
    <text x="74" y="478" class="label" font-weight="700">选择理由：</text><text x="145" y="478" class="label">128 宽度的局部 3-mer 偏差更低，连续条件响应更强，且不同随机种子的波动更小。</text>
    <text x="74" y="502" class="note">当前配置：hidden_size=128，latent_size=16，β=0.20。GC 响应用于观察分布变化，不等同于真实表达强度验证。</text></svg>