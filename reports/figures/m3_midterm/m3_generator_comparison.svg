<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #172033; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .label { font-size: 13px; }
    .small { font-size: 11px; fill: #64748b; }
    .value { font-size: 15px; font-weight: 700; }
    .note { font-size: 12px; fill: #475569; }
    </style><rect width="1000" height="560" fill="#ffffff"/>
    <text x="54" y="52" class="title">M3 两类条件生成器：局部序列质量对比</text>
    <text x="54" y="77" class="subtitle">相同训练集、相同弱/中/强目标组、每组各生成 500 条候选；蓝色为条件自回归，橙色为连续条件 VAE</text>
    <rect x="54" y="104" width="892" height="336" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="92" y="145" class="label" font-weight="700">3-mer JS 散度</text>
    <text x="92" y="164" class="small">越低越接近真实局部序列</text>
    <line x1="92" y1="355" x2="292" y2="355" stroke="#dbe3ee"/>
    <rect x="120" y="342.255699719818" width="56" height="12.744300280182015" fill="#2563eb" rx="4"/>
    <rect x="208" y="208.91304347826085" width="56" height="146.08695652173915" fill="#ea580c" rx="4"/>
    <text x="148" y="372" text-anchor="middle" class="small">自回归</text>
    <text x="236" y="372" text-anchor="middle" class="small">VAE</text>
    <text x="148" y="332.255699719818" text-anchor="middle" class="value">0.00033</text>
    <text x="236" y="198.91304347826085" text-anchor="middle" class="value">0.00376</text>
    <text x="92" y="401" class="note">条件自回归更好</text><text x="388" y="145" class="label" font-weight="700">高频 5-mer 误差</text>
    <text x="388" y="164" class="small">越低越好</text>
    <line x1="388" y1="355" x2="588" y2="355" stroke="#dbe3ee"/>
    <rect x="416" y="276.8187597492359" width="56" height="78.18124025076412" fill="#2563eb" rx="4"/>
    <rect x="504" y="208.91304347826085" width="56" height="146.08695652173915" fill="#ea580c" rx="4"/>
    <text x="444" y="372" text-anchor="middle" class="small">自回归</text>
    <text x="532" y="372" text-anchor="middle" class="small">VAE</text>
    <text x="444" y="266.8187597492359" text-anchor="middle" class="value">0.00032</text>
    <text x="532" y="198.91304347826085" text-anchor="middle" class="value">0.00060</text>
    <text x="388" y="401" class="note">条件自回归更好</text><text x="684" y="145" class="label" font-weight="700">高频 5-mer 重合率</text>
    <text x="684" y="164" class="small">越高越好</text>
    <line x1="684" y1="355" x2="884" y2="355" stroke="#dbe3ee"/>
    <rect x="712" y="208.91304347826085" width="56" height="146.08695652173915" fill="#2563eb" rx="4"/>
    <rect x="800" y="216.8096357226792" width="56" height="138.1903642773208" fill="#ea580c" rx="4"/>
    <text x="740" y="372" text-anchor="middle" class="small">自回归</text>
    <text x="828" y="372" text-anchor="middle" class="small">VAE</text>
    <text x="740" y="198.91304347826085" text-anchor="middle" class="value">0.62</text>
    <text x="828" y="206.8096357226792" text-anchor="middle" class="value">0.58</text>
    <text x="684" y="401" class="note">条件自回归更好</text><rect x="54" y="462" width="892" height="55" rx="8" fill="#eff6ff"/>
    <text x="74" y="486" class="label" font-weight="700">结论：</text><text x="125" y="486" class="label">条件自回归更擅长保留局部 k-mer 与候选 motif，因此是当前 M3 主生成基线。</text>
    <text x="74" y="507" class="note">两类模型的合法比例、新颖比例均为 1.0000；VAE 保留为支持连续强度输入的生成候选。</text></svg>