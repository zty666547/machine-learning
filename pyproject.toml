[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promoter-conditional-generation"
version = "0.1.0"
description = "PR03-01 conditional promoter generation course project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
# Deep conditional generation models (W7). Install the CUDA build separately
# when a GPU is available; see docs/ENVIRONMENT.md.
gen = [
  "torch>=2.2",
]
# EDA, figures and the analysis stack used by the experiment scripts (W2, W8).
analysis = [
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]
# Local development and checked repository layout.
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import the package from the source tree and the entry points from scripts/,
# so the suite behaves identically before and after an editable install.
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
