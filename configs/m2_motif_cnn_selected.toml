[project]
name = "PR03-01 conditional promoter generation"
seed = 20260912

[data]
sequence_file = "promoter.npy"
label_file = "gene_expression.npy"
sequence_length = 50
alphabet = "ACGT"
label_transform = "log10"
split_strategy = "similarity_cluster_90pct"
split_file = "data/splits/ecoli_similarity_split.csv"
train_ratio = 0.70
validation_ratio = 0.15
test_ratio = 0.15

[features]
k_min = 1
k_max = 3
include_gc = true

[model]
name = "motif_cnn_strength"
ridge_alpha = 10.0

[motif_cnn]
kernel_size = 7
filters = 32
location_bins = 5
hidden_size = 64
learning_rate = 0.001
weight_decay = 0.0001
epochs = 150

[logging]
level = "INFO"
directory = "logs"
filename = "pipeline.log"
